<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, World</title>
<style>
  :root {
    --bg: #0b0f14;
    --accent: #5eead4;
    --accent2: #818cf8;
    --text: #e5e7eb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .stage {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(94,234,212,0.15), transparent 70%);
    filter: blur(10px);
    animation: pulse 6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
  }
  h1 {
    font-size: clamp(2.5rem, 8vw, 6rem);
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.03em;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    z-index: 1;
    opacity: 0;
    transform: translateY(20px);
    animation: rise 1s ease forwards 0.2s;
  }
  .cursor {
    display: inline-block;
    width: 0.06em;
    background: var(--accent);
    animation: blink 1s step-end infinite;
    margin-left: 4px;
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  .sub {
    position: absolute;
    bottom: 8%;
    font-size: 0.9rem;
    color: #6b7280;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
    animation: rise 1s ease forwards 0.8s;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <h1>Hello, World<span class="cursor">&nbsp;</span></h1>
    <div class="sub">deployed via GitHub Pages</div>
  </div>
</body>
</html>
